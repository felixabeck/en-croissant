# Backend mutation testing — a periodic deep check, not a per-commit gate.
#
# Only the BACKEND suite lives here. `mutation:frontend` takes ~21 seconds and stays in
# `test.yml`, where it has run since 57b7ec27: moving a fast gate that is currently catching
# a real defect out of per-push CI would make CI pass by dropping a red gate, not by fixing it.
#
# The backend suite is different in kind. Measured on tuxedo-atlas 2026-08-29, the eight
# packages take ~55 minutes together (`database-encoding` alone is 96 mutants in 10 minutes),
# and a GitHub-hosted runner is slower — a single sequential step would sit uncomfortably close
# to the 6-hour per-job limit, so every push would ride on that timing. It also answers a
# different question from the gates: a surviving mutant means a test is missing, not that the
# change under review is wrong.
#
# The matrix is generated from `scripts/run-backend-mutation.mjs --list-packages`, not written
# out again here. A hand-copied list can silently OMIT a package — every remaining job still
# passes, so nothing detects it. The runner already rejects an unknown id, which covers the
# other direction.
name: Mutation
on:
  workflow_dispatch:
  schedule:
    # Sundays, 03:17 UTC. Off-peak, and weekly matches how fast these suites change.
    - cron: "17 3 * * 0"

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync node version
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: List backend mutation packages
        id: list
        run: echo "ids=$(node scripts/run-backend-mutation.mjs --list-packages)" >> "$GITHUB_OUTPUT"

  backend:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.ids) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: mutation-${{ matrix.package }}

      - name: Install pinned Rust mutation tool
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Build frontend
        # cargo-mutants compiles the Tauri binary, and `generate_context!()` panics at compile
        # time when `frontendDist` (`../dist`) does not exist. Same dependency that made every
        # `test.yml` run die before the bindings step was reordered.
        run: pnpm build-vite

      - name: Run mutation tests for ${{ matrix.package }}
        env:
          BACKEND_MUTATION_PACKAGE: ${{ matrix.package }}
        run: pnpm mutation:backend

      - name: Upload mutation report for ${{ matrix.package }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mutation-${{ matrix.package }}
          path: mutants.out/backend/${{ matrix.package }}/
          # `warn`, not `error`: this step runs on failure too, and when the run died before
          # producing a report an upload error only adds a second red step on top of the real one.
          if-no-files-found: warn
