name: Test
on:
  push:
    branches:
      - "probe/windows-rust-test"

permissions:
  contents: read

jobs:
  rust-windows-test-probe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/setup-rust.sh

      - name: Prepare frontend distribution directory
        shell: bash
        run: mkdir -p dist

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --no-fail-fast
