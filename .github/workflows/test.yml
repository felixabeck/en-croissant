name: Test
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from package.json's `packageManager` field; naming it here as
        # well is a second pin that can silently disagree with the first.
        uses: pnpm/action-setup@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run the contract gate
        run: pnpm gates:contract:check

      - name: Run frontend tests and coverage
        run: pnpm test:coverage

      - name: Enforce frontend coverage ratchet
        run: pnpm coverage:frontend:check

      - name: Build frontend
        run: pnpm build-vite

      - name: Verify generated bindings
        # After `build-vite`, not before: this compiles the Tauri binary, and
        # `tauri::generate_context!()` panics when `frontendDist` (`../dist`) does not
        # exist. Locally the directory is usually left over from an earlier build, which
        # is why the ordering held on a developer machine and failed on a clean runner.
        run: pnpm bindings:check

      - name: Enforce frontend bundle budgets
        run: pnpm bundle:check

      - name: Run browser accessibility and visual contracts
        # Inside the pinned Playwright image, whose rendering the committed screenshots
        # match. Running this natively compares the runner's font rasterization against
        # the container's and can fail on antialiasing alone. The image ships the
        # browsers, so no separate `playwright install` step is needed.
        run: pnpm test:e2e:container

      - name: Upload browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-audit
          path: artifacts/frontend-audit/
          # `warn`, not `error`: see the mutation report upload below.
          if-no-files-found: warn

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Run targeted frontend mutation tests
        # Measured 323 seconds on 2026-09-04. All three packages have stayed at 0 survivors since
        # 2026-08-30; f-20260829-08 is handled. The backend suite stays in `mutation.yml` because
        # its runtime is too high for the per-push workflow.
        run: pnpm mutation:frontend

      - name: Upload frontend mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-mutation
          path: artifacts/mutation/frontend/
          # `warn`, not `error`: this runs on failure too, and a missing report then adds a
          # second red step that buries the actual cause.
          if-no-files-found: warn

      - name: Install pinned Rust coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check and lint all Rust targets
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Install pinned Rust coverage toolchain
        run: rustup toolchain install nightly-2025-06-01 --profile minimal --component llvm-tools-preview

      - name: Run Rust tests with coverage
        run: pnpm test:coverage:backend

      - name: Enforce backend coverage ratchet
        run: pnpm coverage:backend:check

      - name: Upload backend coverage
        # `always()`: the measurement is the evidence needed to diagnose a RED ratchet, so
        # uploading it only on success withholds it exactly when it is wanted. The frontend
        # coverage upload has the same problem and the same fix below.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage/
          if-no-files-found: warn
