[package]
name = "en-croissant"
version = "0.15.0"
description = "A Modern Chess Database"
authors = ["Francisco Salgueiro <fgcdbs@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/franciscoBSalgueiro/en-croissant"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.2", features = ["protocol-asset"] }
zip = "2.1.6"
flate2 = "1.0"
tokio = { version = "1.33", features = ["full"] }
futures-util = "0.3.24"
reqwest = { version = "0.12.5", features = ["stream", "blocking", "json"] }
shakmaty = "0.27.1"
pgn-reader = "0.26.0"
csv = "1.1.6"
lazy_static = "1.4.0"
btoi = "0.4.2"
rusqlite = { version = "0.28.0", features = ["bundled"] }
bzip2 = "0.4.3"
zstd = "0.13"
diesel = { version = "2.0.2", features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
    "r2d2",
] }
rayon = "1.6.1"
chrono = "0.4.23"
derivative = "2.2.0"
dashmap = "6.0.1"
once_cell = "1.17.1"
rand = "0.8.5"
vampirc-uci = { git = "https://github.com/franciscoBSalgueiro/vampirc-uci", rev = "0d2b70d1e9cc6fb2159717a7252e1e080c25bd53", features = [
    "specta",
    "serde",
] }
tempfile = "3.6.0"
specta = { version = "^2.0.0-rc.20", features = ["derive"] }
tauri-specta = { version = "^2.0.0-rc.20", features = ["derive", "typescript"] }
strsim = "0.11.0"
thiserror = "2"
log = "0.4.20"
libc = "0.2"
oauth2 = "4.4.2"
axum = "0.6.20"
tar = "0.4.40"
sysinfo = "0.29.10"
governor = "0.6.3"
nonzero_ext = "0.3.0"
specta-typescript = "0.0.9"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-os = "2.3.2"
tauri-plugin-cli = "2.4.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-log = "2.8.0"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2"
memmap2 = "0.9"
rkyv = { version = "0.8", features = ["bytecheck"] }
polyglot-book-rs = "0.1.0"
tokio-util = { version = "0.7.19", features = ["io"] }
url = "2.5.8"
async-trait = "0.1.92"
bytes = "1.12.1"
base64 = "0.22.1"
uuid = { version = "1.24.0", features = ["v4"] }
rustix = { version = "1.1.4", features = ["fs"] }
keyring = "3.6.3"
sha2 = "0.10"
minisign-verify = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2.10.2", features = ["test"] }
