examine_globs = [
  "src/db/encoding.rs",
  "src/db/search.rs",
  "src/engine/types.rs",
  "src/fs.rs",
  "src/game.rs",
  "src/infra/path_authority.rs",
  "src/lexer.rs",
  "src/pgn.rs",
]
